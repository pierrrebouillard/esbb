<style>
  :root{
    /* couleurs officielles du club */
    --blue:#0c1c59;      /* bleu principal  */
    --blue-d:#060f33;    /* bleu foncé      */
    --blue-l:#346fb5;    /* bleu tertiaire  */
    --red:#d4080d;       /* rouge principal */
    --red-d:#9e0609;     /* rouge foncé     */
    --ink:#0c1330; --muted:#6b7488; --line:#e3e6ef; --bg:#f4f6fa; --card:#fff;
    --win:#1f9254; --draw:#c98a06; --loss:#c23b3b; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}

  header{background:linear-gradient(112deg,var(--blue-d) 0%,var(--blue) 52%,var(--blue-l) 135%);
         border-bottom:4px solid var(--red);
         color:#fff;padding:22px 0 26px;margin-bottom:20px}
  .hd{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .crest{width:52px;height:auto;flex:0 0 auto;display:block;
         filter:drop-shadow(0 3px 10px rgba(0,0,0,.45))}
  h1{font-size:21px;margin:0;letter-spacing:-.3px;line-height:1.15}
  .sub{font-size:12.5px;opacity:.75;margin-top:3px}
  .hd-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select.season{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
                padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer}
  select.season option{color:#111}
  .btn{border:none;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;
       cursor:pointer;font-family:inherit;transition:.15s}
  .btn-w{background:#fff;color:var(--blue)} .btn-w:hover{background:#e9eff7}
  .btn-red{background:var(--red);color:#fff} .btn-red:hover{background:var(--red-d)}
  .btn-blue{background:var(--blue);color:#fff} .btn-blue:hover{background:var(--blue-d)}
  .btn-line{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn-line:hover{background:#eaf1f9}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:23px;line-height:1.1;letter-spacing:-.5px}
  .stat small{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
  .stat.v b{color:var(--win)} .stat.n b{color:var(--draw)} .stat.d b{color:var(--loss)}

  .next{background:linear-gradient(100deg,var(--blue),var(--blue-l));color:#fff;border-radius:var(--r);
        padding:16px 18px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .next .lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.7}
  .next .big{font-size:17.5px;font-weight:750;letter-spacing:-.3px;margin-top:3px}
  .next .sm{font-size:12.5px;opacity:.8;margin-top:3px}
  .next .cd{margin-left:auto;text-align:center;background:rgba(255,255,255,.15);border-radius:12px;padding:9px 16px}
  .next .cd b{display:block;font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1}
  .next .cd small{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;opacity:.8}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
        padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

  .tabs{display:flex;gap:6px;background:#e5eaf2;padding:4px;border-radius:12px;margin-bottom:14px;width:fit-content}
  .tab{border:none;background:transparent;padding:8px 18px;border-radius:9px;font-size:13.5px;font-weight:650;
       cursor:pointer;color:var(--muted);font-family:inherit}
  .tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(12,28,89,.14)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .cal-nav{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .cal-nav h2{margin:0;font-size:16.5px;text-transform:capitalize;letter-spacing:-.2px}
  .nav-b{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;
         font-size:15px;line-height:1;color:var(--blue);font-family:inherit}
  .nav-b:hover{background:#eaf1f9}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);background:#f4f7fb;border-bottom:1px solid var(--line)}
  .dow div{padding:8px 6px;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);
           text-transform:uppercase;letter-spacing:.7px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cell{min-height:100px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
        padding:6px;position:relative;transition:.12s}
  .cell:nth-child(7n){border-right:none}
  .cell.has:hover{background:#eef3f9}
  .cell.out{background:#fafbfd;color:#c3c8d4}
  .cell.today{box-shadow:inset 0 0 0 2px var(--red)}
  .dnum{font-size:12px;font-weight:700;color:var(--muted)}
  .cell.today .dnum{color:var(--red)}
  .ev{cursor:pointer;margin-top:4px;border-radius:7px;padding:4px 6px;font-size:10.5px;font-weight:650;line-height:1.25;color:#fff}
  .ev.dom{background:var(--blue)} .ev.ext{background:var(--red)}
  .ev .tag{display:block;font-size:8.5px;opacity:.85;font-weight:800;letter-spacing:.4px}

  .month-h{padding:11px 16px;background:#f4f7fb;border-bottom:1px solid var(--line);border-top:1px solid var(--line);
           font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--blue)}
  .row{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
  .row:hover{background:#f7fafd}
  .row.past{opacity:.7}
  .row.nxt{background:#eaf1f9;box-shadow:inset 3px 0 0 var(--blue-l)}
  .dbox{width:52px;flex:0 0 auto;text-align:center;border-radius:10px;padding:6px 0;background:#eaf1f9}
  .dbox .d{font-size:19px;font-weight:800;line-height:1;letter-spacing:-.5px}
  .dbox .m{font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-top:2px}
  .lg{width:34px;height:34px;flex:0 0 auto;object-fit:contain}
  .lg.vide{border-radius:50%;background:#eef1f6}
  .duel{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 4px}
  .duel img{width:52px;height:52px;object-fit:contain;
            filter:drop-shadow(0 1px 4px rgba(0,0,0,.35))}
  .row .info{flex:1;min-width:0}
  .row .ttl{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
  .row .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .pill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 7px;
        border-radius:20px;text-transform:uppercase;vertical-align:1px;margin-right:6px}
  .pill.dom,.pill.ext{font-size:12.5px;line-height:1.2;padding:2px 8px;letter-spacing:0}
  .pill.dom{background:#e2ecf7;color:var(--blue)}
  .pill.ext{background:#fce3e3;color:var(--red-d)}
  .pill.cp{background:#eceef4;color:#46506b}
  .score{flex:0 0 auto;text-align:right}
  .score .s{font-size:17px;font-weight:800;letter-spacing:-.5px}
  .score .r{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:1px}
  .r.V{color:var(--win)} .r.N{color:var(--draw)} .r.D{color:var(--loss)}
  .score .todo{font-size:11px;font-weight:700;color:var(--muted);background:#eef1f6;padding:5px 9px;border-radius:8px}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px}

  .rk-wrap{overflow-x:auto}
  table.rk{width:100%;border-collapse:collapse;font-size:13.5px}
  .rk th{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
         padding:11px 6px;border-bottom:1px solid var(--line);text-align:center;background:#f4f7fb}
  .rk th.l,.rk td.l{text-align:left}
  .rk td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
  .rk td.l{font-weight:650;letter-spacing:-.2px}
  .rk td.pos{width:34px;font-weight:800;color:var(--muted)}
  .rk td.lgc{width:34px;padding:4px}
  .rk td.lgc img{width:26px;height:26px;object-fit:contain;display:block;margin:auto}
  .rk td.pts{font-weight:800;font-size:15px}
  .rk tr.moi{background:#eaf1f9}
  .rk tr.moi td{box-shadow:inset 0 -1px 0 var(--line)}
  .rk tr.moi td.l{color:var(--blue)}
  .rk tr.moi td.pos{color:var(--blue)}
  .rk-note{padding:12px 16px;background:#f4f7fb;border-bottom:1px solid var(--line);
           font-size:12.5px;color:var(--muted)}
  .rk-maj{padding:11px 16px;font-size:11.5px;color:var(--muted);text-align:center}

  .ov{position:fixed;inset:0;background:rgba(6,15,51,.6);display:none;align-items:center;justify-content:center;
      padding:18px;z-index:50}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow:auto;
         box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .mh h3{margin:0;font-size:16px;letter-spacing:-.2px}
  .x{margin-left:auto;border:none;background:#eef1f6;width:30px;height:30px;border-radius:8px;cursor:pointer;
     font-size:16px;color:var(--muted);font-family:inherit}
  .mb{padding:18px 20px}
  .fiche{border-radius:12px;padding:16px 18px;text-align:center;margin-bottom:16px;color:#fff}
  .fiche.V{background:linear-gradient(100deg,#177a45,#1f9254)}
  .fiche.N{background:linear-gradient(100deg,#a8730a,#c98a06)}
  .fiche.D{background:linear-gradient(100deg,#9e0609,var(--red))}
  .fiche.A{background:linear-gradient(100deg,var(--blue),var(--blue-l))}
  .fiche .lb{font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;opacity:.85}
  .fiche .sc{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1.15;margin:2px 0 3px}
  .fiche .eq{font-size:11.5px;opacity:.85;line-height:1.4}
  .fl{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
  .fl span{flex:0 0 118px;font-size:10.5px;font-weight:800;text-transform:uppercase;
           letter-spacing:.6px;color:var(--muted)}
  .fl b{font-size:14px;font-weight:650}
  .src{margin-top:14px;font-size:11px;color:var(--muted);text-align:center}
  .fg{margin-bottom:13px}
  .fg label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
            color:var(--muted);margin-bottom:5px}
  .fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
            font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid var(--blue-l);outline-offset:-1px;border-color:transparent}
  .fg textarea{resize:vertical;min-height:60px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
  .mf .left{margin-right:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);
         color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;
         transition:.25s;z-index:99;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .footer{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .footer .sp{margin-left:auto;font-size:11.5px;color:var(--muted)}
  @media(max-width:720px){
    .wrap{padding:0 12px 48px}
    header{padding:16px 0 18px;margin-bottom:14px}

    .crest{width:42px}
    .hd-right{width:100%;margin-left:0} select.season{width:100%}

    .stat b{font-size:18px} .stat small{font-size:9px;letter-spacing:.3px}
    .chip{padding:6px 11px;font-size:12px}
    .tabs{width:100%} .tab{flex:1;padding:8px 6px;font-size:12.5px}

    .cell{min-height:52px;padding:3px}
    .dnum{font-size:10.5px}
    .ev{font-size:8.5px;padding:2px 3px;border-radius:5px}

    .dow div{font-size:9px;letter-spacing:.3px}
    .cal-nav{padding:11px 12px} .cal-nav h2{font-size:14.5px}

    .row{padding:11px 12px;gap:10px}
    .dbox{width:44px} .dbox .d{font-size:17px}
    .lg{width:28px;height:28px}
    .row .ttl{font-size:13px} .row .meta{font-size:11px}
    .score .s{font-size:15px}

    .rk th,.rk td{padding:8px 3px;font-size:12px}
    .rk td.l{font-size:11.5px}
    .rk td.lgc{display:none} .rk th:nth-child(2){display:none}

    .two{grid-template-columns:1fr}
    .modal{max-width:100%}
    .duel img{width:44px;height:44px}
    .fiche .sc{font-size:32px}
    .fl span{flex:0 0 94px;font-size:10px}
    .footer .btn{flex:1;min-width:140px}
    .footer .sp{width:100%;margin-left:0;text-align:center;margin-top:6px}
  }
  @media(max-width:400px){
    .next .big{font-size:15px}
  }

  /* ---------- impression : feuille A4 pour le club house ---------- */
  @media print{
    @page{size:A4 portrait;margin:12mm}
    body{background:#fff}
    header{background:#fff!important;color:var(--ink);border-bottom:3px solid var(--red);

    a{text-decoration:none;color:inherit}
  }

  /* --- petits écrans : on garde la 3D, on répare ce qui casse sur Safari iOS ---
     1. « zoom » sur un élément en perspective : remplacé par un scale du parent
     2. l'animation de masque (le blason qui monte) n'est pas fiable sur iOS :
        remplacée par une apparition en fondu, épaisseur par épaisseur.
        On ne touche pas à « transform », sinon la pile 3D s'effondrerait. */
  @media (max-width:720px){
    .esbb-persp{transform:scale(.6);transform-origin:50% 42%}
    .esbb-slab,.esbb-face{mask-image:none;-webkit-mask-image:none;
      animation:esbb-fondu .7s ease-out both}
    .esbb-stage i:nth-of-type(2){animation-delay:0.00s}
    .esbb-stage i:nth-of-type(3){animation-delay:0.02s}
    .esbb-stage i:nth-of-type(4){animation-delay:0.04s}
    .esbb-stage i:nth-of-type(5){animation-delay:0.06s}
    .esbb-stage i:nth-of-type(6){animation-delay:0.08s}
    .esbb-stage i:nth-of-type(7){animation-delay:0.10s}
    .esbb-stage i:nth-of-type(8){animation-delay:0.12s}
    .esbb-stage i:nth-of-type(9){animation-delay:.30s}
    .esbb-shadow{animation-delay:.35s}
  }
  @keyframes esbb-fondu{from{opacity:0}to{opacity:1}}
  /* si le découpage en forme d'écusson n'est pas géré (iOS < 15.4),
     on masque les épaisseurs : le blason garde son liseré rouge propre */
  @supports not (clip-path: path("M 0 0 L 1 1")){
    .esbb-slab{display:none}
  }

  /* --- intro déjà vue récemment : version courte, pas de suppression --- */
  html.esbb-court .esbb-slab,html.esbb-court .esbb-face{animation-duration:.7s;animation-delay:.04s}
  html.esbb-court .esbb-shadow{animation-duration:.55s;animation-delay:.12s}
  html.esbb-court .esbb-track i{animation-duration:1s;animation-delay:.04s}
  html.esbb-court .esbb-stage{animation-delay:.85s}
  html.esbb-court .esbb-words b:nth-child(1){animation-delay:.42s}
  html.esbb-court .esbb-words b:nth-child(2){animation-delay:.50s}
  html.esbb-court .esbb-words b:nth-child(3){animation-delay:.58s}
  html.esbb-court .esbb-words b:nth-child(4){animation-delay:.66s}
  @media (max-width:720px){
    html.esbb-court .esbb-slab,html.esbb-court .esbb-face{animation-duration:.55s}
    html.esbb-court .esbb-stage i:nth-of-type(9){animation-delay:.18s}
  }
  /* --- « Réduire les animations » activé (réglages d'accessibilité) ---
     Il ne faut PAS écraser la durée à 0,01 s : le balancement du blason est
     déclaré « infinite alternate », il se met alors à vibrer 50 fois par seconde
     et la barre se remplit d'un coup. On coupe donc les animations et on place
     directement chaque élément dans son état final. */
  @media (prefers-reduced-motion:reduce){
    #esbb-loader *,#esbb-loader{animation:none!important;transition:none!important}
    .esbb-stage{transform:rotateX(6deg) rotateY(0deg)!important}
    .esbb-face,.esbb-slab{opacity:1!important;
      mask-position:0 0!important;-webkit-mask-position:0 0!important;
      mask-image:none!important;-webkit-mask-image:none!important}
    .esbb-words b{opacity:1!important;transform:none!important}
    .esbb-shadow{opacity:.5!important}
    .esbb-track i{transform:scaleX(1)!important}
  }

LOGOS[CLUB] = document.querySelector('.crest').src;
function logo(n){ return LOGOS[n] || ""; }

/* ---------- état ---------- */
/* équipes engagées par saison (même si le calendrier n'est pas encore publié) */
const EQUIPES = {
  "2026-2027": [R3, F1F, F2F],
  "2025-2026": [R3]
};

let DB, season, filtre = R3, vue = "cal", cur = new Date(), editId = null;
function equipes(){
  const dec = EQUIPES[season] || [];
  const vues = [...new Set((DB.seasons[season]||[]).map(m=>m.comp||"Autre"))];
  return [...dec, ...vues.filter(c=>!dec.includes(c))];
}
function filtreDefaut(){
  const c=equipes();
  return c.includes(R3) ? R3 : (c[0] || "tout");
}

function uid(){ return "m"+Math.random().toString(36).slice(2,9); }
function seed(){
  const d = {seasons:{}, saved:new Date().toISOString()};
  for (const s in OFFICIEL){
    d.seasons[s] = OFFICIEL[s].map(m => ({
      id:uid(), date:m.date, time:m.time, lieu:m.lieu, adv:m.adv,
      comp:m.c, j:m.j,
      stade: m.lieu==="dom" ? STADE_DEF : (STADES[m.adv] || ""), note:"",
      sp: m.sp!=null ? m.sp : null, sc: m.sc!=null ? m.sc : null
    }));
  }
  return d;
}
/* Site public en lecture seule : l'état vit dans l'URL, pas dans le navigateur.
   Un lien copié ouvre donc exactement la même vue chez le destinataire. */
function save(){
  const q=new URLSearchParams();
  q.set("saison", season);
  q.set("equipe", filtre);
  if(vue!=="cal") q.set("vue", vue);
  history.replaceState(null,"", location.pathname+"?"+q.toString());
  renderSaved();
}
function allM(){ return (DB.seasons[season]||[]).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); }
function matches(){ return filtre==="tout" ? allM() : allM().filter(m=>(m.comp||"")===filtre); }

/* ---------- helpers ---------- */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS3=["jan","fév","mar","avr","mai","juin","juil","août","sep","oct","nov","déc"];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function played(m){ return m.sp!=null && m.sp!=="" && m.sc!=null && m.sc!==""; }
function res(m){ if(!played(m)) return null; return m.sp>m.sc?"V":(m.sp===m.sc?"N":"D"); }
function label(m){ return m.lieu==="dom" ? CLUB+" – "+m.adv : m.adv+" – "+CLUB; }
function scoreTxt(m){ return m.lieu==="dom" ? m.sp+" – "+m.sc : m.sc+" – "+m.sp; }
function abbr(c){ return c===R3?"R3" : c===F1F?"F1F" : c===F2F?"F2F" : (c||"").slice(0,4); }
const ICO={dom:"\u{1F3E0}", ext:"\u2708\uFE0F"};
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2200); }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function nextMatch(){ return matches().find(m=>new Date(m.date+"T23:59:59")>=new Date()); }

/* ---------- rendus ---------- */
function renderSeasons(){
  const sel=document.getElementById("seasonSel");
  sel.innerHTML=Object.keys(DB.seasons).sort().reverse()
    .map(s=>`<option value="${s}">Saison ${s}</option>`).join("");
  sel.value=season;
}
function renderFilters(){
  const comps=equipes(), el=document.getElementById("filters");
  if(!comps.includes(filtre)) filtre=filtreDefaut();
  if(comps.length<2){ el.innerHTML=""; return; }
  el.innerHTML=comps.map(c=>{
    const n=allM().filter(m=>(m.comp||"Autre")===c).length;
    return `<button class="chip ${filtre===c?"on":""}" data-f="${esc(c)}">${esc(c)} ${n?"("+n+")":"· à venir"}</button>`;
  }).join("");
}
function renderNext(){
  const m=nextMatch(), el=document.getElementById("nextBox");
  if(!matches().length){
    el.innerHTML=`<div class="next"><div>
      <div class="lbl">${esc(filtre)}</div>
      <div class="big">Calendrier pas encore publié</div>
      <div class="sm">Il sera ajouté dès sa parution par la Ligue.</div></div></div>`;
    document.getElementById("stats").innerHTML=""; return;
  }
  if(!m){ el.innerHTML=""; return; }
  const d=new Date(m.date+"T00:00:00");
  const days=Math.round((d-today0())/86400000);
  el.innerHTML=`<div class="next">
    <div>
      <div class="lbl">Prochain match</div>
      <div class="big">${esc(label(m))}</div>
      <div class="sm">${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()} · ${m.time}
        · ${esc(m.comp||"")} ${m.j?"· "+m.j:""} · ${m.lieu==="dom"?"à domicile":"à l'extérieur"}</div>
    </div>
    <div class="cd"><b>${days<=0?"J":"J-"+days}</b><small>${days===0?"aujourd'hui":days===1?"demain":"jours"}</small></div>
  </div>`;
}
function renderStats(){
  const ms=matches(), pl=ms.filter(played);
  if(!ms.length){ document.getElementById("stats").innerHTML=""; return; }
  const v=pl.filter(m=>res(m)==="V").length, n=pl.filter(m=>res(m)==="N").length, d=pl.filter(m=>res(m)==="D").length;
  const dom=ms.filter(m=>m.lieu==="dom").length;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><small>Matchs</small><b>${ms.length}</b></div>
    <div class="stat"><small>À domicile</small><b>${dom}</b></div>
    <div class="stat"><small>Extérieur</small><b>${ms.length-dom}</b></div>
    <div class="stat"><small>Joués</small><b>${pl.length}</b></div>
    <div class="stat v"><small>Victoires</small><b>${v}</b></div>
    <div class="stat n"><small>Nuls</small><b>${n}</b></div>
    <div class="stat d"><small>Défaites</small><b>${d}</b></div>`;
}
function renderCal(){
  const y=cur.getFullYear(), mo=cur.getMonth();
  document.getElementById("monthTitle").textContent=MOIS[mo]+" "+y;
  const off=(new Date(y,mo,1).getDay()+6)%7;
  const start=new Date(y,mo,1-off);
  const byDate={}; matches().forEach(m=>{ (byDate[m.date]=byDate[m.date]||[]).push(m); });
  const tdy=iso(today0()); let h="";
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const k=iso(d), out=d.getMonth()!==mo;
    let ev="";
    (byDate[k]||[]).forEach(m=>{
      ev+=`<div class="ev ${m.lieu}" data-id="${m.id}">
             <span class="tag">${ICO[m.lieu]} ${m.time} · ${abbr(m.comp)}</span>${esc(m.adv)}</div>`;
    });
    h+=`<div class="cell ${out?"out":""} ${k===tdy?"today":""} ${ev?"has":""}" data-date="${k}"><div class="dnum">${d.getDate()}</div>${ev}</div>`;
  }
  document.getElementById("grid").innerHTML=h;
}
function renderList(){
  const ms=matches(), el=document.getElementById("listView");
  if(!ms.length){
    el.innerHTML=`<div class="empty"><b style="color:var(--ink)">${esc(filtre)}</b><br><br>
      Calendrier pas encore publié par la Ligue.<br>Il sera ajouté dès sa parution.</div>`;
    return;
  }
  const tdy=today0(), nx=nextMatch(); let h="", lastM="";
  ms.forEach(m=>{
    const d=new Date(m.date+"T00:00:00");
    const mk=MOIS[d.getMonth()]+" "+d.getFullYear();
    if(mk!==lastM){ h+=`<div class="month-h">${mk}</div>`; lastM=mk; }
    const r=res(m);
    const sc=played(m)
      ? `<div class="s">${scoreTxt(m)}</div><div class="r ${r}">${r==="V"?"Victoire":r==="N"?"Nul":"Défaite"}</div>`
      : `<div class="todo">À jouer</div>`;
    h+=`<div class="row ${d<tdy?"past":""} ${nx&&nx.id===m.id?"nxt":""}" data-id="${m.id}">
          <div class="dbox"><div class="d">${d.getDate()}</div><div class="m">${MOIS3[d.getMonth()]}</div></div>
          ${logo(m.adv)?`<img class="lg" src="${logo(m.adv)}" alt="">`:`<span class="lg vide"></span>`}
          <div class="info">
            <div class="ttl">${esc(label(m))}</div>
            <div class="meta"><span class="pill ${m.lieu}" title="${m.lieu==="dom"?"À domicile":"À l\u2019extérieur"}">${ICO[m.lieu]}</span>
              <span class="pill cp">${esc(abbr(m.comp))}</span>
              ${JOURS[d.getDay()]} ${m.time||""}${m.j?" · "+esc(m.j):""}${m.stade?" · "+esc(m.stade):""}
              ${m.note?"<br>📝 "+esc(m.note):""}</div>
          </div>
          <div class="score">${sc}</div>
        </div>`;
  });
  el.innerHTML=h;
}
function renderRank(){
  const el=document.getElementById("rankView");
  const c=(CLASSEMENTS[season]||{})[filtre];
  if(!c){
    const archive = !CLASSEMENTS[season];
    el.innerHTML=`<div class="empty"><b style="color:var(--ink)">${esc(filtre)}</b><br><br>` + (archive
      ? `Classement non disponible.<br>La FFR retire les classements archivés au changement de saison.`
      : `Classement pas encore publié par la Ligue.<br>Il sera ajouté dès sa parution.`) + `</div>`;
    return;
  }
  const joue=c.lignes.some(l=>l[2]>0);
  const L=c.lignes.slice().sort((a,b)=> b[1]-a[1] || (b[6]-b[7])-(a[6]-a[7]) || a[0].localeCompare(b[0]));
  const d=new Date(c.maj+"T00:00:00");
  const dd=new Date(c.debut+"T00:00:00");
  el.innerHTML=`
    ${joue?"":`<div class="rk-note">Saison pas encore commencée — coup d\u2019envoi le
       ${dd.getDate()} ${MOIS[dd.getMonth()]} ${dd.getFullYear()}.</div>`}
    <div class="rk-wrap"><table class="rk">
      <thead><tr><th></th><th></th><th class="l">Club</th>
        <th>J</th><th>V</th><th>N</th><th>D</th><th>Diff</th><th>Pts</th></tr></thead>
      <tbody>${L.map((r,i)=>{
        const moi = r[0]===CLUB, diff=r[6]-r[7];
        return `<tr class="${moi?"moi":""}">
          <td class="pos">${i+1}</td>
          <td class="lgc">${logo(r[0])?`<img src="${logo(r[0])}" alt="">`:""}</td>
          <td class="l">${esc(r[0])}</td>
          <td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td>
          <td>${diff>0?"+"+diff:diff}</td><td class="pts">${r[1]}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
    <div class="rk-maj">Classement relevé le ${d.toLocaleDateString("fr-FR")} sur monclubhouse.ffr.fr</div>`;
}
function renderSaved(){
  const c=(CLASSEMENTS[season]||{})[filtre];
  document.getElementById("savedAt").textContent=
    "Données officielles FFR" + (c ? " · relevées le "+new Date(c.maj+"T00:00:00").toLocaleDateString("fr-FR") : "")
    + " · mise à jour chaque lundi";
}
function renderAll(){ renderFilters(); renderNext(); renderStats(); renderCal(); renderList(); renderRank(); renderSaved(); }

/* ---------- fiche match (lecture seule) ---------- */
function ligne(l,v){ return v ? `<div class="fl"><span>${l}</span><b>${v}</b></div>` : ""; }
function openModal(m){
  if(!m) return;
  const d=new Date(m.date+"T00:00:00"), r=res(m);
  const jours=Math.round((d-today0())/86400000);
  let bloc;
  if(played(m)){
    bloc=`<div class="fiche ${r}">
      <div class="lb">${r==="V"?"Victoire":r==="N"?"Match nul":"Défaite"}</div>
      <div class="duel">
        <img src="${logo(m.lieu==="dom"?CLUB:m.adv)}" alt="">
        <div class="sc">${scoreTxt(m)}</div>
        <img src="${logo(m.lieu==="dom"?m.adv:CLUB)}" alt="">
      </div>
      <div class="eq">${esc(m.lieu==="dom"?CLUB:m.adv)} &nbsp;·&nbsp; ${esc(m.lieu==="dom"?m.adv:CLUB)}</div>
    </div>`;
  } else {
    bloc=`<div class="fiche A">
      <div class="lb">${jours<0?"Résultat non communiqué":"À jouer"}</div>
      <div class="duel">
        <img src="${logo(m.lieu==="dom"?CLUB:m.adv)}" alt="">
        <div class="sc">— · —</div>
        <img src="${logo(m.lieu==="dom"?m.adv:CLUB)}" alt="">
      </div>
      <div class="eq">${jours===0?"aujourd\u2019hui":jours===1?"demain":jours>0?"dans "+jours+" jours":"match passé"}</div>
    </div>`;
  }
  document.getElementById("mTitle").textContent=label(m);
  document.getElementById("mBody").innerHTML = bloc
    + ligne("Compétition", esc(m.comp||""))
    + ligne("Journée", esc(m.j||""))
    + ligne("Date", JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear())
    + ligne("Coup d\u2019envoi", m.time||"")
    + ligne("Lieu", (m.lieu==="dom"?"\u{1F3E0} À domicile":"\u2708\uFE0F À l\u2019extérieur"))
    + ligne("Stade", esc(m.stade|| (m.lieu==="dom"?STADE_DEF:"Terrain de l\u2019adversaire — non communiqué")))
    + `<div class="src">Données officielles FFR — monclubhouse.ffr.fr</div>`;
  document.getElementById("ov").classList.add("on");
}
function closeModal(){ document.getElementById("ov").classList.remove("on"); }
document.getElementById("mClose").onclick=closeModal;
document.getElementById("ov").onclick=e=>{ if(e.target.id==="ov") closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- events ---------- */
document.getElementById("prevM").onclick=()=>{ cur=new Date(cur.getFullYear(),cur.getMonth()-1,1); renderCal(); };
document.getElementById("nextM").onclick=()=>{ cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); renderCal(); };
document.getElementById("todayBtn").onclick=()=>{ cur=new Date(); renderCal(); };
document.getElementById("filters").onclick=e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  filtre=c.dataset.f; renderAll(); save();
};
document.getElementById("grid").onclick=e=>{
  const ev=e.target.closest(".ev"); if(!ev) return;
  const m=allM().find(x=>x.id===ev.dataset.id); if(m) openModal(m);
};
document.getElementById("listView").onclick=e=>{
  const r=e.target.closest(".row"); if(!r) return;
  const m=allM().find(x=>x.id===r.dataset.id); if(m) openModal(m);
};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  vue=t.dataset.v; appliqueVue(); save();
});
function appliqueVue(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.v===vue));
  document.getElementById("calView").style.display  = vue==="cal" ?"":"none";
  document.getElementById("listView").style.display = vue==="list"?"":"none";
  document.getElementById("rankView").style.display = vue==="rank"?"":"none";
}
document.getElementById("seasonSel").onchange=e=>{
  season=e.target.value; filtre=filtreDefaut(); appliqueVue();
  const ms=allM();
  const nx=ms.find(m=>new Date(m.date+"T23:59:59")>=new Date());
  cur = ms.length ? new Date((nx?nx.date:ms[ms.length-1].date)+"T00:00:00") : new Date();
  renderAll(); save();
};
function dl(name,content,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click();
}
document.getElementById("icsBtn").onclick=()=>{
  const pad=n=>String(n).padStart(2,"0");
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ESBB//Calendrier//FR\r\nCALSCALE:GREGORIAN\r\n";
  matches().forEach(m=>{
    const d=new Date(m.date+"T"+(m.time||"15:00"));
    const s=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
    const e=new Date(d.getTime()+2*3600*1000);
    const en=e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate())+"T"+pad(e.getHours())+pad(e.getMinutes())+"00";
    ics+="BEGIN:VEVENT\r\nUID:"+m.id+"@esbb\r\nDTSTART:"+s+"\r\nDTEND:"+en+"\r\n"
      +"SUMMARY:"+label(m).replace(/,/g,"\\,")+"\r\n"
      +"LOCATION:"+((m.stade||(m.lieu==="dom"?STADE_DEF:"Extérieur")).replace(/,/g,"\\,"))+"\r\n"
      +"DESCRIPTION:"+((m.comp||"")+(m.j?" · "+m.j:"")+(m.note?" · "+m.note:"")).replace(/,/g,"\\,")+"\r\n"
      +"END:VEVENT\r\n";
  });
  ics+="END:VCALENDAR\r\n";
  dl("esbb-"+season+".ics",ics,"text/calendar");
  toast("Fichier .ics téléchargé");
};
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("exportBtn").onclick=()=>dl("calendrier-esbb.json",JSON.stringify(DB,null,2),"application/json");
/* ---------- init ---------- */
DB=seed();
for(const s in OFFICIEL){ if(!DB.seasons[s]) DB.seasons[s]=[]; }
season=new URLSearchParams(location.search).get("saison");
if(!season || !DB.seasons[season]){
  const keys=Object.keys(DB.seasons).sort();
  const avecFutur=keys.filter(s=>DB.seasons[s].some(m=>new Date(m.date+"T23:59:59")>=new Date()));
  season = avecFutur.length ? avecFutur[0] : (keys.filter(s=>DB.seasons[s].length).pop() || keys.pop());
}
const _ms=allM();
if(_ms.length){
  const nx=_ms.find(m=>new Date(m.date+"T23:59:59")>=new Date());
  cur=new Date((nx?nx.date:_ms[_ms.length-1].date)+"T00:00:00");
}
const _q=new URLSearchParams(location.search);
const _eq=_q.get("equipe");
filtre = (_eq && equipes().includes(_eq)) ? _eq : filtreDefaut();
/* sur téléphone la vue liste est plus lisible que la grille du mois */
vue = _q.get("vue") || (matchMedia("(max-width:720px)").matches ? "list" : "cal");
if(!["cal","list","rank"].includes(vue)) vue="cal";
appliqueVue();
renderSeasons(); renderAll(); save();
</script>
<script id="esbb-loader-js">
(function () {
  window.ESBB_VERSION = 4;   // repère : permet de vérifier quelle version est chargée
  var ESBB_MIN_MS = 3200;   // durée mini d'affichage (1250 ms si l'intro a déjà été vue)
  var ESBB_MAX_MS = 5000;   // filet de sécurité si quelque chose ne charge pas
  var el = document.getElementById('esbb-loader');
  if (!el) return;

  // intro déjà vue récemment : même animation, mais raccourcie
  if (/\besbb-court\b/.test(document.documentElement.className)) ESBB_MIN_MS = 1250;
  // animations réduites : rien à regarder, on abrège
  try {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
      ESBB_MIN_MS = Math.min(ESBB_MIN_MS, 900);
  } catch(e) {}
  try { localStorage.setItem('esbb-intro', String(Date.now())); } catch(e) {}
  el.addEventListener('click', function(){ hide(); });   // un appui passe l'intro

  var t0 = Date.now(), hidden = false;
  function hide() {
    if (hidden) return;
    hidden = true;
    el.classList.add('esbb-done');
    document.documentElement.classList.remove('esbb-loading');
    document.body.classList.remove('esbb-loading');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
  }
  function ready() { setTimeout(hide, Math.max(0, ESBB_MIN_MS - (Date.now() - t0))); }
  if (document.readyState === 'complete') ready();
  else window.addEventListener('load', ready);
  setTimeout(hide, ESBB_MAX_MS);
})();
</script>
