name: Mise à jour du calendrier

on:
  schedule:
    # Tous les lundis à 06:00 UTC (08:00 à Paris l'été, 07:00 l'hiver)
    - cron: "0 6 * * 1"
  workflow_dispatch: # permet aussi de lancer la mise à jour à la main

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lire monclubhouse et mettre à jour index.html
        run: node maj.mjs .

      - name: Publier les changements
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement, rien à publier."
            exit 0
          fi
          git config user.name "Mise à jour automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Résultats et classement du week-end"
          git push
